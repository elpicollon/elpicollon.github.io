    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }

    gtag('config', 'G-EEXLG6QY6S');

    // Defer loading of GTM script
    function loadGTM() {
      if (window.gtmLoaded) return;
      window.gtmLoaded = true;
      var script = document.createElement('script');
      script.src = 'https://www.googletagmanager.com/gtag/js?id=G-EEXLG6QY6S';
      script.async = true;
      document.head.appendChild(script);
    }

    // Load on user interaction
    ['mousedown', 'keydown', 'scroll', 'touchstart'].forEach(event => {
      window.addEventListener(event, loadGTM, { once: true, passive: true });
    });

    // Fallback after 6 seconds
    setTimeout(loadGTM, 6000);
  </script>

  <!-- SPA GitHub Pages - Script para restaurar URL do redirecionamento 404 -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
